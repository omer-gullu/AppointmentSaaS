name: Deploy to Hetzner

# Secrets hazır olunca push tetikleyicisini açın (aşağıdaki yorum satırları).
on:
  push:
    branches: [main, master]
    paths:
      - 'Appointment_SaaS.API/**'
      - 'Appointment_SaaS.WebUI/**'
      - 'Appointment_SaaS.Business/**'
      - 'Appointment_SaaS.Core/**'
      - 'Appointment_SaaS.Data/**'
      - 'e2e/**'
      - 'deploy/api/**'
      - 'deploy/webui/**'
      - 'deploy/ensure-env.sh'
      - '.github/workflows/deploy-hetzner.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: both
        type: choice
        options:
          - api
          - webui
          - both

env:
  DOTNET_VERSION: '8.0.x'
  API_DEPLOY_PATH: /opt/appointmentsaas/api
  WEBUI_DEPLOY_PATH: /opt/appointmentsaas/webui

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.result.outputs.api }}
      webui: ${{ steps.result.outputs.webui }}
      shared: ${{ steps.result.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: paths
        with:
          filters: |
            api:
              - 'Appointment_SaaS.API/**'
              - 'deploy/api/**'
              - 'deploy/ensure-env.sh'
            webui:
              - 'Appointment_SaaS.WebUI/**'
              - 'deploy/webui/**'
              - 'deploy/ensure-env.sh'
            shared:
              - 'Appointment_SaaS.Business/**'
              - 'Appointment_SaaS.Core/**'
              - 'Appointment_SaaS.Data/**'
              - 'deploy/ensure-env.sh'
              - '.github/workflows/deploy-hetzner.yml'

      - id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
            if [ "$TARGET" = "api" ] || [ "$TARGET" = "both" ]; then
              echo "api=true" >> "$GITHUB_OUTPUT"
            else
              echo "api=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$TARGET" = "webui" ] || [ "$TARGET" = "both" ]; then
              echo "webui=true" >> "$GITHUB_OUTPUT"
            else
              echo "webui=false" >> "$GITHUB_OUTPUT"
            fi
            echo "shared=false" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.paths.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "webui=${{ steps.paths.outputs.webui }}" >> "$GITHUB_OUTPUT"
            echo "shared=${{ steps.paths.outputs.shared }}" >> "$GITHUB_OUTPUT"
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & build solution
        run: |
          dotnet restore Appointment_SaaS.sln
          dotnet build Appointment_SaaS.sln -c Release --no-restore

      - name: Unit tests (deploy gate)
        run: dotnet test Appointment_SaaS.Test/Appointment_SaaS.Test.csproj -c Release --no-build --verbosity normal

      - name: Setup Node (page smoke)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Start WebUI (page smoke)
        run: |
          dotnet run --project Appointment_SaaS.WebUI/Appointment_SaaS.WebUI.csproj -c Release --no-build --urls "http://127.0.0.1:5259" &
          echo $! > webui-smoke.pid
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ApiBaseUrl: http://127.0.0.1:9

      - name: Wait for WebUI
        run: |
          for i in {1..60}; do
            curl -sf -o /dev/null http://127.0.0.1:5259/Pricing && exit 0
            sleep 2
          done
          echo "WebUI smoke health failed"
          exit 1

      - name: Playwright page smoke (Pricing + Login)
        working-directory: e2e
        env:
          CI: true
          PLAYWRIGHT_ENV: development
          E2E_WEB_UI_URL: http://127.0.0.1:5259
          E2E_API_URL: http://127.0.0.1:5294
          E2E_SMOKE_PAGES_ONLY: 'true'
        run: npm run test:smoke

      - name: Stop WebUI smoke
        if: always()
        run: kill $(cat webui-smoke.pid 2>/dev/null) 2>/dev/null || true

      - name: Install API gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          dotnet tool install --global dotnet-ef --version 8.0.23 || true
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Migrate and seed isolated Postgres
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=e2e;Username=postgres;Password=postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 2
          done
          dotnet ef database update \
            --project Appointment_SaaS.Data/Appointment_SaaS.Data.csproj \
            --startup-project Appointment_SaaS.API/Appointment_SaaS.API.csproj
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d e2e -v ON_ERROR_STOP=1 -f e2e/scripts/ci-seed.sql

      - name: Start API (appointment CRUD gate)
        run: |
          dotnet run --project Appointment_SaaS.API/Appointment_SaaS.API.csproj -c Release --no-build --urls "http://127.0.0.1:5294" &
          echo $! > api-gate.pid
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=e2e;Username=postgres;Password=postgres
          TokenOptions__SecurityKey: CI_ONLY_JWT_KEY_32_CHARS_MIN_OK_1234
          EncryptionSettings__AesKey: 0123456789abcdef0123456789abcdef
          Google__SkipEventSync: true
          WebhookSecurity__N8nAuthToken: CI-N8N-SYSTEM-TOKEN-UNUSED
          EvolutionApi__BaseUrl: http://127.0.0.1:9
          IyzicoSettings__Enabled: false

      - name: Wait for API
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5294/api/Tenants/GetContextByInstance?instanceName=ci-janti" || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ] || [ "$code" = "404" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "API gate health failed"
          exit 1

      - name: Playwright appointment CRUD gate
        working-directory: e2e
        env:
          CI: true
          PLAYWRIGHT_ENV: development
          E2E_WEB_UI_URL: http://127.0.0.1:5259
          E2E_API_URL: http://127.0.0.1:5294
          E2E_N8N_TOKEN: JNT-123-ABC
          E2E_TENANT_ID: '1'
          E2E_INSTANCE_NAME: ci-janti
          E2E_SERVICE_ID: '1'
          E2E_STAFF_ID: '101'
        run: npm run test:gate

      - name: Stop API gate
        if: always()
        run: kill $(cat api-gate.pid 2>/dev/null) 2>/dev/null || true

  deploy-api:
    needs: [validate, changes]
    if: |
      needs.validate.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'api' || github.event.inputs.target == 'both')) ||
        (github.event_name == 'push' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hetzner

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: |
          dotnet publish Appointment_SaaS.API/Appointment_SaaS.API.csproj \
            -c Release \
            -o ./publish/api \
            --self-contained false

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload API
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
        run: |
          USER="${DEPLOY_USER:-root}"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./publish/api/ "${USER}@${DEPLOY_HOST}:${{ env.API_DEPLOY_PATH }}/"

      - name: Upload API env template
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
        run: |
          USER="${DEPLOY_USER:-root}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${USER}@${DEPLOY_HOST}" "mkdir -p /opt/appointmentsaas"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/ensure-env.sh "${USER}@${DEPLOY_HOST}:/tmp/appointmentsaas-api-ensure-env.sh"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/api/env.example "${USER}@${DEPLOY_HOST}:/tmp/appointmentsaas-api.env.example"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${USER}@${DEPLOY_HOST}" \
            "install -m 755 /tmp/appointmentsaas-api-ensure-env.sh /opt/appointmentsaas/ensure-env.sh && install -m 644 /tmp/appointmentsaas-api.env.example /opt/appointmentsaas/api.env.example && rm -f /tmp/appointmentsaas-api-ensure-env.sh /tmp/appointmentsaas-api.env.example"

      - name: Restart API
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
        run: |
          USER="${DEPLOY_USER:-root}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${USER}@${DEPLOY_HOST}" bash -s << 'REMOTE'
          set -euo pipefail
          mkdir -p /opt/appointmentsaas/api
          if [ ! -f /etc/systemd/system/appointmentsaas-api.service ]; then
            cat > /etc/systemd/system/appointmentsaas-api.service << 'UNIT'
          [Unit]
          Description=AppointmentSaaS API
          After=network.target

          [Service]
          WorkingDirectory=/opt/appointmentsaas/api
          ExecStart=/usr/bin/dotnet /opt/appointmentsaas/api/Appointment_SaaS.API.dll
          Restart=always
          RestartSec=5
          EnvironmentFile=-/opt/appointmentsaas/api.env
          Environment=ASPNETCORE_URLS=http://127.0.0.1:5294
          User=www-data
          Group=www-data

          [Install]
          WantedBy=multi-user.target
          UNIT
            systemctl daemon-reload
            systemctl enable appointmentsaas-api
          fi
          chown -R www-data:www-data /opt/appointmentsaas/api
          bash /opt/appointmentsaas/ensure-env.sh api /opt/appointmentsaas/api.env.example
          systemctl restart appointmentsaas-api
          systemctl is-active appointmentsaas-api
          REMOTE

  deploy-webui:
    needs: [validate, changes]
    if: |
      needs.validate.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'webui' || github.event.inputs.target == 'both')) ||
        (github.event_name == 'push' && (needs.changes.outputs.webui == 'true' || needs.changes.outputs.shared == 'true'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hetzner

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish WebUI
        run: |
          dotnet publish Appointment_SaaS.WebUI/Appointment_SaaS.WebUI.csproj \
            -c Release \
            -o ./publish/webui \
            --self-contained false

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload WebUI
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
        run: |
          USER="${DEPLOY_USER:-root}"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./publish/webui/ "${USER}@${DEPLOY_HOST}:${{ env.WEBUI_DEPLOY_PATH }}/"

      - name: Upload WebUI env template
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
        run: |
          USER="${DEPLOY_USER:-root}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${USER}@${DEPLOY_HOST}" "mkdir -p /opt/appointmentsaas"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/ensure-env.sh "${USER}@${DEPLOY_HOST}:/tmp/appointmentsaas-webui-ensure-env.sh"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/webui/env.example "${USER}@${DEPLOY_HOST}:/tmp/appointmentsaas-webui.env.example"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${USER}@${DEPLOY_HOST}" \
            "install -m 755 /tmp/appointmentsaas-webui-ensure-env.sh /opt/appointmentsaas/ensure-env.sh && install -m 644 /tmp/appointmentsaas-webui.env.example /opt/appointmentsaas/webui.env.example && rm -f /tmp/appointmentsaas-webui-ensure-env.sh /tmp/appointmentsaas-webui.env.example"

      - name: Restart WebUI
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
        run: |
          USER="${DEPLOY_USER:-root}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${USER}@${DEPLOY_HOST}" bash -s << 'REMOTE'
          set -euo pipefail
          mkdir -p /opt/appointmentsaas/webui
          if [ ! -f /etc/systemd/system/appointmentsaas-webui.service ]; then
            cat > /etc/systemd/system/appointmentsaas-webui.service << 'UNIT'
          [Unit]
          Description=AppointmentSaaS WebUI
          After=network.target appointmentsaas-api.service

          [Service]
          WorkingDirectory=/opt/appointmentsaas/webui
          ExecStart=/usr/bin/dotnet /opt/appointmentsaas/webui/Appointment_SaaS.WebUI.dll
          Restart=always
          RestartSec=5
          EnvironmentFile=-/opt/appointmentsaas/webui.env
          Environment=ASPNETCORE_URLS=http://127.0.0.1:5259
          User=www-data
          Group=www-data

          [Install]
          WantedBy=multi-user.target
          UNIT
            systemctl daemon-reload
            systemctl enable appointmentsaas-webui
          fi
          chown -R www-data:www-data /opt/appointmentsaas/webui
          bash /opt/appointmentsaas/ensure-env.sh webui /opt/appointmentsaas/webui.env.example
          systemctl restart appointmentsaas-webui
          systemctl is-active appointmentsaas-webui
          REMOTE

  # Deploy sonrası canlı duman testi — secret gerektirmez, salt-okunur sayfa kontrolleri.
  # Pricing render + Register/Sektör (WebUI→API bağlantısı) doğrulanır.
  smoke:
    needs: [deploy-api, deploy-webui]
    if: always() && (needs.deploy-api.result == 'success' || needs.deploy-webui.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_ENV: production
      E2E_WEB_UI_URL: https://akillirandevu.net
      E2E_API_URL: https://akillirandevu.net
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright deps
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run live smoke
        working-directory: e2e
        run: npm run test:smoke

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            e2e/playwright-report-smoke/
            e2e/test-results-smoke/
          retention-days: 7
