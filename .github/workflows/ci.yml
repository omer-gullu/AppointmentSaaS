name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore Appointment_SaaS.sln

      - name: Build solution (7 proje)
        run: dotnet build Appointment_SaaS.sln -c Release --no-restore

      - name: Unit tests (Appointment_SaaS.Test)
        run: dotnet test Appointment_SaaS.Test/Appointment_SaaS.Test.csproj -c Release --no-build --verbosity normal

      - name: Build E2E project (.NET Playwright — derleme kontrolü)
        run: dotnet build Appointment_SaaS.E2E/Appointment_SaaS.E2E.csproj -c Release -p:SkipPlaywrightInstall=true

      - name: Setup Node (page smoke)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Start WebUI (page smoke)
        run: |
          dotnet run --project Appointment_SaaS.WebUI/Appointment_SaaS.WebUI.csproj -c Release --no-build --urls "http://127.0.0.1:5259" &
          echo $! > webui-smoke.pid
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ApiBaseUrl: http://127.0.0.1:9

      - name: Wait for WebUI
        run: |
          for i in {1..60}; do
            curl -sf -o /dev/null http://127.0.0.1:5259/Pricing && exit 0
            sleep 2
          done
          echo "WebUI smoke health failed"
          exit 1

      - name: Playwright page smoke (Pricing + Login)
        working-directory: e2e
        env:
          CI: true
          PLAYWRIGHT_ENV: development
          E2E_WEB_UI_URL: http://127.0.0.1:5259
          E2E_API_URL: http://127.0.0.1:5294
          E2E_SMOKE_PAGES_ONLY: 'true'
        run: npm run test:smoke

      - name: Stop WebUI smoke
        if: always()
        run: kill $(cat webui-smoke.pid 2>/dev/null) 2>/dev/null || true
