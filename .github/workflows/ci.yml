name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore Appointment_SaaS.sln

      - name: Build solution (7 proje)
        run: dotnet build Appointment_SaaS.sln -c Release --no-restore

      - name: Unit tests (Appointment_SaaS.Test)
        run: dotnet test Appointment_SaaS.Test/Appointment_SaaS.Test.csproj -c Release --no-build --verbosity normal

      - name: Build E2E project (.NET Playwright — derleme kontrolü)
        run: dotnet build Appointment_SaaS.E2E/Appointment_SaaS.E2E.csproj -c Release -p:SkipPlaywrightInstall=true

      - name: Setup Node (page smoke)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Start WebUI (page smoke)
        run: |
          dotnet run --project Appointment_SaaS.WebUI/Appointment_SaaS.WebUI.csproj -c Release --no-build --urls "http://127.0.0.1:5259" &
          echo $! > webui-smoke.pid
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ApiBaseUrl: http://127.0.0.1:9

      - name: Wait for WebUI
        run: |
          for i in {1..60}; do
            curl -sf -o /dev/null http://127.0.0.1:5259/Pricing && exit 0
            sleep 2
          done
          echo "WebUI smoke health failed"
          exit 1

      - name: Playwright page smoke (Pricing + Login)
        working-directory: e2e
        env:
          CI: true
          PLAYWRIGHT_ENV: development
          E2E_WEB_UI_URL: http://127.0.0.1:5259
          E2E_API_URL: http://127.0.0.1:5294
          E2E_SMOKE_PAGES_ONLY: 'true'
        run: npm run test:smoke

      - name: Stop WebUI smoke
        if: always()
        run: kill $(cat webui-smoke.pid 2>/dev/null) 2>/dev/null || true

      - name: Install API gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          dotnet tool install --global dotnet-ef --version 8.0.23 || true
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Migrate and seed isolated Postgres
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=e2e;Username=postgres;Password=postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 2
          done
          dotnet ef database update \
            --project Appointment_SaaS.Data/Appointment_SaaS.Data.csproj \
            --startup-project Appointment_SaaS.API/Appointment_SaaS.API.csproj
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d e2e -v ON_ERROR_STOP=1 -f e2e/scripts/ci-seed.sql

      - name: Start API (appointment CRUD gate)
        run: |
          dotnet run --project Appointment_SaaS.API/Appointment_SaaS.API.csproj -c Release --no-build --urls "http://127.0.0.1:5294" &
          echo $! > api-gate.pid
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=e2e;Username=postgres;Password=postgres
          TokenOptions__SecurityKey: CI_ONLY_JWT_KEY_32_CHARS_MIN_OK_1234
          EncryptionSettings__AesKey: 0123456789abcdef0123456789abcdef
          Google__SkipEventSync: true
          WebhookSecurity__N8nAuthToken: CI-N8N-SYSTEM-TOKEN-UNUSED
          EvolutionApi__BaseUrl: http://127.0.0.1:9
          IyzicoSettings__Enabled: false

      - name: Wait for API
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5294/api/Tenants/GetContextByInstance?instanceName=ci-janti" || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ] || [ "$code" = "404" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "API gate health failed"
          exit 1

      - name: Playwright appointment CRUD gate
        working-directory: e2e
        env:
          CI: true
          PLAYWRIGHT_ENV: development
          E2E_WEB_UI_URL: http://127.0.0.1:5259
          E2E_API_URL: http://127.0.0.1:5294
          E2E_N8N_TOKEN: JNT-123-ABC
          E2E_TENANT_ID: '1'
          E2E_INSTANCE_NAME: ci-janti
          E2E_SERVICE_ID: '1'
          E2E_STAFF_ID: '101'
        run: npm run test:gate

      - name: Stop API gate
        if: always()
        run: kill $(cat api-gate.pid 2>/dev/null) 2>/dev/null || true
