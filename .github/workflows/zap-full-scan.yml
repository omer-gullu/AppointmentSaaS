name: DAST - OWASP ZAP Full (Active) Scan

on:
  # Şimdilik SADECE manuel tetikleme - baseline'dan daha agresif olduğu için
  # otomatik/zamanlanmış çalıştırmıyoruz. Sonuçları gördükten sonra schedule ekleyebiliriz.
  workflow_dispatch:

jobs:
  zap_full_scan:
    runs-on: ubuntu-latest
    name: ZAP Full Scan (Active - Production, hassas endpointler hariç)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: ZAP Full Scan çalıştır
        uses: zaproxy/action-full-scan@v0.13.0
        # NOT: Bu action'ın kendi iç artifact yükleme adımı, GitHub'ın eski/kullanımdan
        # kaldırılmış artifact API'sini kullandığı için "Create Artifact Container failed"
        # hatasıyla başarısız olabiliyor. Tarama kendisi başarılı şekilde tamamlanıyor ve
        # raporlar aşağıdaki "Tarama raporunu artifact olarak yükle" adımıyla zaten
        # yükleniyor, bu yüzden bu bilinen upstream hatasının job'u kırmasını önlüyoruz.
        continue-on-error: true
        with:
          target: 'https://akillirandevu.net'
          artifact_name: 'zap-full-report'
          cmd_options: >-
            -z "-config globalexcludeurl.url_list.url(0).regex=^https://akillirandevu\.net/Auth/GenerateOtp.*
            -config globalexcludeurl.url_list.url(0).description=OTP_gonderme_gercek_WhatsApp_mesaji_tetikler
            -config globalexcludeurl.url_list.url(0).enabled=true
            -config globalexcludeurl.url_list.url(1).regex=^https://akillirandevu\.net/Auth/VerifyOtp.*
            -config globalexcludeurl.url_list.url(1).description=OTP_dogrulama
            -config globalexcludeurl.url_list.url(1).enabled=true
            -config globalexcludeurl.url_list.url(2).regex=^https://akillirandevu\.net/.*[Pp]ayment.*
            -config globalexcludeurl.url_list.url(2).description=Odeme_Iyzico_ile_ilgili_sayfalar
            -config globalexcludeurl.url_list.url(2).enabled=true
            -config globalexcludeurl.url_list.url(3).regex=^https://akillirandevu\.net/.*[Cc]heckout.*
            -config globalexcludeurl.url_list.url(3).description=Checkout_ile_ilgili_sayfalar
            -config globalexcludeurl.url_list.url(3).enabled=true"
          fail_action: false
          allow_issue_writing: false

      - name: Tarama raporunu artifact olarak yükle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-scan-report
          path: |
            report_html.html
            report_md.md
            report_json.json
