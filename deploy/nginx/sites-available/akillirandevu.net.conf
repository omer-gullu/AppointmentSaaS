# /etc/nginx/sites-available/akillirandevu.net
# ln -s /etc/nginx/sites-available/akillirandevu.net /etc/nginx/sites-enabled/
# Certbot: certbot --nginx -d akillirandevu.net -d www.akillirandevu.net

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name akillirandevu.net www.akillirandevu.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name akillirandevu.net www.akillirandevu.net;

    # certbot yolları (örnek — sunucudaki gerçek path'e göre güncelleyin)
    ssl_certificate     /etc/letsencrypt/live/akillirandevu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akillirandevu.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # İstemcinin gönderdiği X-Forwarded-* / X-Real-IP EZİLSİR — rate-limit bypass engeli
    location / {
        proxy_pass http://127.0.0.1:5259;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
    }
}
