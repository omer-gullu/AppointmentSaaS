# /etc/nginx/sites-available/api.akillirandevu.net
#
# API yalnızca loopback'te dinler (http://127.0.0.1:5294).
# Bu vhost'u SADECE n8n / iç servisler dışarıdan API'ye ihtiyaç duyuyorsa açın.
# Panel (WebUI) zaten sunucu içinde localhost:5294 kullanır — public API şart değil.
#
# Güvenlik tercihi: public API açmayın. Gerekirse IP allowlist + rate limit ekleyin.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.akillirandevu.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.akillirandevu.net;

    ssl_certificate     /etc/letsencrypt/live/api.akillirandevu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.akillirandevu.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # İsteğe bağlı: yalnızca bilinen IP'ler (n8n aynı sunucudaysa public API'ye gerek yok)
    # allow 203.0.113.10;
    # deny all;

    location / {
        # Swagger / health dışarıya kapalı tutmak isterseniz:
        # location ~* ^/(swagger|health) { return 404; }

        proxy_pass http://127.0.0.1:5294;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
