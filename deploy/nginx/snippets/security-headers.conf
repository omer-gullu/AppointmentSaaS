# Kenar güvenlik başlıkları — HSTS yalnızca burada (uygulama UseHsts kullanmaz).
# include /etc/nginx/snippets/security-headers.conf;

# Nginx sürümünü gizle (Proxy Disclosure / fingerprint)
server_tokens off;

# TRACE / TRACK metodlarını reddet (ZAP Proxy Disclosure)
# Not: nginx "if is evil" uyarısı bilinir; metod reddi için yaygın ve güvenli kullanım.
if ($request_method ~* ^(TRACE|TRACK)$) {
    return 405;
}

# HSTS — tek kaynak (çift header olmasın; app'te UseHsts yok)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
